apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woo-mcp
  template:
    metadata:
      labels:
        app: woo-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: woo-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          ports:
            - containerPort: 3000
          env:
            - name: WC_URL
              value: "{{ .Values.wcUrl }}"
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.secretName }}"
                  key: consumer-key
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.secretName }}"
                  key: consumer-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false