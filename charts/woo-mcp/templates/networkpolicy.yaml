apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: woo-mcp-only-gateway
spec:
  podSelector:
    matchLabels:
      app: woo-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "{{ .Values.gatewayNamespace }}"
          podSelector:
            matchLabels:
              app: gateway
      ports:
        - port: 3000
