apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          ports:
            - containerPort: 4000
          env:
            env:
              - name: DB_PATH
                value: /data/gateway.db
              - name: JWT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Values.secretName }}"
                    key: jwt-secret
              - name: GEMINI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Values.secretName }}"
                    key: gemini-api-key
                    optional: true
              - name: GEMINI_MODEL
                value: "{{ .Values.geminiModel }}"
              - name: NODE_OPTIONS
                value: "--dns-result-order=ipv4first"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gateway-data
