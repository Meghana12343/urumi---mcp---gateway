apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  clusterIP: None
  selector: {app: mysql}
  ports: [{port: 3306}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          ports: [{containerPort: 3306}]
          env:
            - name: MYSQL_DATABASE
              value: wordpress
            - name: MYSQL_USER
              value: wordpress
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: mysql-password}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: mysql-root-password}}
          readinessProbe:
            exec: {command: ["sh","-c","mysqladmin ping -uroot -p$MYSQL_ROOT_PASSWORD"]}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["sh","-c","mysqladmin ping -uroot -p$MYSQL_ROOT_PASSWORD"]}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storageClass }}
        storageClassName: {{ .Values.storageClass }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.mysql.storage }}}